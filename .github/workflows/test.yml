name: Tests

on:
  push:
    paths:
      - ".github/workflows/test.yml"
      - "src/**"
      - "dts/**"
      - "include/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "Kconfig"
      - "zephyr/module.yml"
  pull_request:
    paths:
      - ".github/workflows/test.yml"
      - "src/**"
      - "dts/**"
      - "include/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "Kconfig"
      - "zephyr/module.yml"
  schedule:
    # Weekly check (Mon 09:00 JST) so upstream ZMK changes that break the
    # module are noticed even when this repository has no new commits.
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  collect-tests:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Find tests
        id: find
        run: |
          # Each leg tests this module against one ZMK line:
          # - 0.3: the latest v0.3.x release branch (Zephyr 3.5, native_posix_64)
          # - 0.4-dev: floating main, which will become ZMK v0.4
          #   (Zephyr 4.1, native_sim). Floating on purpose: if an upstream
          #   change breaks the module, the scheduled run turns red.
          LEGS='[
            {"zmk_name": "0.3", "zmk_ref": "v0.3-branch", "image": "docker.io/zmkfirmware/zmk-build-arm:3.5", "board": "native_posix_64", "keymap": "native_posix_64.keymap"},
            {"zmk_name": "0.4-dev", "zmk_ref": "main", "image": "docker.io/zmkfirmware/zmk-build-arm:4.1", "board": "native_sim//zmk_test_mock", "keymap": "native_sim.keymap"}
          ]'
          MATRIX='[]'
          while IFS= read -r leg; do
            keymap=$(jq -r '.keymap' <<< "${leg}")
            while IFS= read -r testdir; do
              [ -n "${testdir}" ] || continue
              MATRIX=$(jq -c --argjson leg "${leg}" --arg test "${testdir}" \
                '. + [$leg + {test: $test}]' <<< "${MATRIX}")
            done < <(find tests -name "${keymap}" -exec dirname {} \; | sort)
          done < <(jq -c '.[]' <<< "${LEGS}")
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  run-tests:
    needs: collect-tests
    if: ${{ needs.collect-tests.outputs.matrix != '[]' }}
    name: "test (zmk ${{ matrix.zmk_name }}, ${{ matrix.test }})"
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.collect-tests.outputs.matrix) }}
    steps:
      - name: Checkout module
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: module

      - name: Checkout ZMK
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: zmkfirmware/zmk
          ref: ${{ matrix.zmk_ref }}
          path: zmk

      - name: Cache west modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            zmk/modules/
            zmk/tools/
            zmk/zephyr/
            zmk/bootloader/
          key: ${{ runner.os }}-west-${{ matrix.zmk_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-west-${{ matrix.zmk_name }}-
        timeout-minutes: 2
        continue-on-error: true

      - name: Initialize west workspace
        working-directory: zmk
        run: |
          west init -l app
          west update --fetch-opt=--filter=tree:0
          west zephyr-export

      - name: Run test
        working-directory: zmk/app
        env:
          ZMK_EXTRA_MODULES: ${{ github.workspace }}/module
          TEST_PATH: ${{ matrix.test }}
        run: |
          testpath="${ZMK_EXTRA_MODULES}/${TEST_PATH}"
          testcase=$(basename "$testpath")
          build_dir="build/tests/${testcase}"

          echo "Running ${testcase}..."
          west build -s . -d "${build_dir}" -b ${{ matrix.board }} -p -- \
            -DCONFIG_ASSERT=y \
            -DZMK_CONFIG="${testpath}" \
            -DZMK_EXTRA_MODULES="${ZMK_EXTRA_MODULES}"

          "${build_dir}/zephyr/zmk.exe" \
            | sed -e 's/.*> //' \
            | tee "${build_dir}/keycode_events_full.log" \
            | sed -n -f "${testpath}/events.patterns" \
            > "${build_dir}/keycode_events.log"

          diff -auZ "${testpath}/keycode_events.snapshot" "${build_dir}/keycode_events.log"

      - name: Archive logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ matrix.zmk_name }}-${{ strategy.job-index }}-log"
          path: zmk/app/build/**/*.log
